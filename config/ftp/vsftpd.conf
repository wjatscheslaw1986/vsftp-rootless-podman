listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES

# Virtual users
guest_enable=YES
guest_username=ftpuser
virtual_use_local_privs=YES

# Per-user directory
user_sub_token=$USER
local_root=/srv/ftp/$USER

local_umask=077
file_open_mode=0666
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
xferlog_file=/var/log/vsftpd/vsftpd.log
connect_from_port_20=YES
port_enable=YES
ftp_data_port=20
idle_session_timeout=1200
data_connection_timeout=1200
nopriv_user=ftpuser
ftpd_banner=Willkommen zu FTP Server von Wjatscheslaw!
chroot_local_user=YES
chroot_list_enable=NO
secure_chroot_dir=/var/run/vsftpd/empty
allow_writeable_chroot=NO
pam_service_name=vsftpd

rsa_cert_file=/opt/vsftpd/vsftpd.crt
rsa_private_key_file=/run/secrets/vsftpd.key
ssl_ciphers=ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256
ssl_enable=YES
implicit_ssl=YES
allow_anon_ssl=NO
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1_3=YES
ssl_tlsv1_2=NO
ssl_tlsv1_1=NO
ssl_tlsv1=NO
ssl_sslv2=NO
ssl_sslv3=NO
listen_port=990
utf8_filesystem=YES
port_promiscuous=NO
pasv_promiscuous=NO
pasv_min_port=21100
pasv_max_port=21110
pasv_enable=YES
pasv_addr_resolve=NO
pasv_address=ftp.wjatscheslaw1986.com
hide_ids=YES
seccomp_sandbox=YES
background=NO
local_max_rate=90000000
max_clients=55
max_per_ip=900
